  camera.position.set(panX+radius*Math.sin(phi)*Math.sin(theta),
                      panY+radius*Math.cos(phi),
                      panZ+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(panX,panY,panZ);
}
updateCam();
let drag=false,rDrag=false,px=0,py=0;
